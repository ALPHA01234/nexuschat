<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusChat Control Center</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="adminGate" class="admin-gate"><div class="gate-card"><div class="brand">NEXUS<span>CHAT</span></div><h1>Control Center</h1><p id="adminIdentity">Verifying owner access…</p><a href="/" class="btn">Back to NexusChat</a></div></div>
<main id="adminApp" class="admin-app" style="display:none">
<aside class="admin-side"><div class="brand">NEXUS<span>CHAT</span></div><div class="owner-chip"><span class="owner-dot"></span><div><strong>Owner Console</strong><small id="ownerEmail"></small></div></div><nav><button class="nav-btn active">Overview</button><a href="/" class="nav-btn">Back to app</a></nav></aside>
<section class="admin-main"><header class="admin-top"><div><span class="eyebrow">OWNER ADMINISTRATION</span><h1>Control Center</h1></div><button class="btn" id="refreshBtn">Refresh</button></header>
<div id="errorBox" class="error"></div>
<div class="stats-grid"><div class="stat"><span>Accounts</span><strong id="statUsers">—</strong></div><div class="stat"><span>Active</span><strong id="statActive">—</strong></div><div class="stat"><span>Premium</span><strong id="statPremium">—</strong></div><div class="stat"><span>Communities</span><strong id="statCommunities">—</strong></div></div>
<section class="panel"><div class="toolbar"><input id="searchBox" placeholder="Search username, display name, or email"><button class="btn primary" id="searchBtn">Search</button></div><div class="meta" id="resultMeta"></div><div class="table-wrap"><table class="users"><thead><tr><th>User</th><th>Email</th><th>Status</th><th>Plan</th><th>Coins</th><th>Joined</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div><div class="pager"><button class="btn" id="prevBtn">Previous</button><span class="meta" id="pageMeta"></span><button class="btn" id="nextBtn">Next</button></div></section>
</section></main>
<div id="promptModal" class="prompt-modal"><div class="prompt-box"><button class="prompt-x" id="promptX">×</button><h3 id="promptTitle">Action</h3><div id="promptContent"></div><div class="prompt-actions"><button class="btn" id="promptCancel">Cancel</button><button class="btn primary" id="promptConfirm">Confirm</button></div></div></div>
<script src="admin.js"></script></body></html>
